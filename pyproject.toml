[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-windows-translator"
version = "1.0.0"
description = "Professional, lightweight, 100% offline Arabic-English translator for Windows using CTranslate2 and INT8"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Offline Translator Team" }
]
dependencies = [
    "PySide6-Essentials>=6.5.0",
    "ctranslate2>=4.0.0",
    "sentencepiece>=0.2.0",
    "requests>=2.28.0",
    "qtawesome>=1.3.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0.0",
    "pytest>=7.0.0",
]

[project.scripts]
offline-translator = "Localex.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

